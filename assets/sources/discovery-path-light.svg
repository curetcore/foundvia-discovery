<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="title desc"><title id="title">Evidence → one change → verification</title><desc id="desc">Read the finding. Make one authorized change. Rerun and compare the evidence. A clear report is not proof of traffic.</desc><rect width="640" height="780" rx="24" fill="#fafafa" /><rect x="1" y="1" width="638" height="778" rx="24" fill="none" stroke="#d4d4d8" /><text x="40" y="110" font-size="44" font-weight="500" font-family="Geist" fill="#52525b">01</text><text x="40" y="178" font-size="46" font-weight="600" font-family="Geist" fill="#18181b">Read the evidence</text><text x="40" y="230" font-size="38" font-weight="400" font-family="Geist" fill="#52525b">Find one real blocker.</text><path d="M60 254 v48 m-9 -9 9 9 9 -9" fill="none" stroke="#71717a" stroke-width="3" /><text x="40" y="348" font-size="44" font-weight="500" font-family="Geist" fill="#52525b">02</text><text x="40" y="416" font-size="46" font-weight="600" font-family="Geist" fill="#18181b">Make one change</text><text x="40" y="468" font-size="38" font-weight="400" font-family="Geist" fill="#52525b">Keep the scope small.</text><path d="M60 492 v48 m-9 -9 9 9 9 -9" fill="none" stroke="#71717a" stroke-width="3" /><text x="40" y="586" font-size="44" font-weight="500" font-family="Geist" fill="#52525b">03</text><text x="40" y="654" font-size="46" font-weight="600" font-family="Geist" fill="#18181b">Rerun and compare</text><text x="40" y="706" font-size="38" font-weight="400" font-family="Geist" fill="#52525b">Verify what changed.</text></svg>